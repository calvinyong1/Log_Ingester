# Single-VM deployment: Caddy terminates HTTPS and routes one domain to the
# dashboard and the API. Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
name: log-anomaly-prod

x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisting these keeps the issued certificate across restarts, so
      # Let's Encrypt rate limits aren't hit by redeploys.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the API (Caddy routes by path), so no CORS is needed.
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped

  migrate:
    <<: *backend
    restart: "no"
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/logs
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/logs
      REDIS_URL: redis://redis:6379/0
      ENV: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: https://${DOMAIN}
      API_KEY: ${API_KEY:?set API_KEY in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["sh", "-c", "uv run --no-dev rq worker --url \"$$REDIS_URL\" ingest"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/logs
      REDIS_URL: redis://redis:6379/0
      ENV: production
      LOG_LEVEL: INFO
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: logs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued-but-unprocessed events survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

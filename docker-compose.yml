services:
  migrate:
    build:
      context: ./backend
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/logs
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/logs
      REDIS_URL: redis://redis:6379/0
      ENV: development
      LOG_LEVEL: INFO
      LOG_FORMAT: ${LOG_FORMAT:-text}
      CORS_ORIGINS: http://localhost:5173
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "uv run --no-dev rq worker --with-scheduler --worker-class app.worker.logging_worker.LoggingWorker --url \"$$REDIS_URL\" ingest"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/logs
      REDIS_URL: redis://redis:6379/0
      ENV: development
      LOG_LEVEL: INFO
      LOG_FORMAT: ${LOG_FORMAT:-text}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-15}
      PRUNE_INTERVAL_SECONDS: ${PRUNE_INTERVAL_SECONDS:-3600}
      PRUNE_BATCH_SIZE: ${PRUNE_BATCH_SIZE:-5000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_GRAFANA_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Old samples are deleted after this long. Prometheus has its own clock for
      # this; it is not tied to any database prune, so keep the two numbers in step.
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-15d}
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read-only access and framing are what let the React dashboard
      # embed the panels. Fine locally; deployment needs real auth in front.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  promdata:
  grafanadata:
